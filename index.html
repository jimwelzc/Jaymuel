<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>9 CSS Hover Button</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }
        
        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:#0f172a;
            font-family: system-ui, apple-system, sans-serif;
            padding:2rem;
        }
        
        .grid{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap:2rem;
            max-width:850px;
            width:100%;
        }
        .btn{
            position:relative;
            padding:16px 28px;
            font-size:16px;
            font-weight:600;
            color:#ffffff;
            background:#1e293b;
            border:2px solid #38bdf8;
            border-radius:8px;
            cursor:pointer;
            overflow:hidden;
            transition:all 0.3s ease;
            z-index:1;
            text-align:center;
        }
        
        .glow:hover{
            background:#38bdf8;
            color:#0f172a;
            box-shadow:0 0 15px #38bdf8, 0 0 40px #38bdf8;
        }
            
        .left::before{
            content:"";
            position:absolute;
            top:0;
            left:0;
            width:0%;
            height:100%;
            background:#38bdf8;
            transition:width 0.3s ease;
            z-index:-1;
        }
        .left:hover{
            color:#0f172a;
        }
        .left:hover::before{
            width:100%;
        }
        
        .right::before{
            content:"";
            position:absolute;
            top:0;
            right:0;
            width:0%;
            height:100%;
            background:#38bdf8;
            transition:width 0.3s ease;
            z-index:-1;
        }
        .right:hover{
            color:#0f172a;
        }
        .right:hover::before{
            width:100%;
        }
        
        .center::before{
            content:"";
            position:absolute;
            top:50%;
            left:50%;
            width:0%;
            height:100%;
            background:#38bdf8;
            transform:translate(-50%, -50%);
            transition:width 0.3s ease;
            z-index:-1;
        }
        .center:hover{
            color:#0f172a;
        }
        .center:hover::before{
            width:105%;
        }
        
        .shine::before{
            content:"";
            position:absolute;
            top:0;
            left:-75%;
            width:50%;
            height:100%;
            background:linear-gradient(
            120deg,
            transparent,
            rgba(255, 255, 255, 0.5),
            transparent
            );
            transform:skewX(-25deg);
            transition:left 0.5s ease;
        }
        .shine:hover::before{
            left:125%;
        }
        
        .threeD{
            background:#38bdf8;
            color:#0f172a;
            border:none;
            box-shadow:0 6px 0 #0284c7;
            transition:transform 0.1s ease, box-shadow 0.1s ease;
        }
        .threeD:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 0 #0284c7;
        }
        .threeD:active{
            transform:translateY(4px);
            box-shadow:0 2px 0 #0284c7;
        }
        
        .border{
            border:2px solid transparent;
            background:linear-gradient(#1c293b, #1e293b)padding-box, linear-gradient(45deg, #38bdf8, #a855f7, #ec4899)border-box;
        }
        .border:hover{
            box-shadow:0 0 20px rgba(168, 85, 247, 0.6);
            transform:scale(1.03);
        }
        
        .ripple::after{
            content:"";
            position:absolute;
            top:50%;
            left:50%;
            width:0;
            height:0;
            background:rgba(56, 189, 248, 0.4);
            border-radius:50%;
            transform:translate(-50%, -50%);
            transition:width 0.5s ease, height 0.5s ease, opacity 0.5s ease;
            z-index:-1;
        }
        .ripple:hover::after{
            width:300px;
            height:300px;
        }
        
        .slide span{
            display:inline-block;
            transition:transform 0.3s ease;
        }
        .slide::after{
            content:"Let's Go";
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, 150%);
            color:#38bdf8;
            transition:transform 0.3s ease;
            white-space:nowrap;
        }
        .slide:hover span{
            transform:translateY(-200%);
        }
        .slide:hover::after{
            transform:translate(-50%,-50%);
        }
    </style>
</head>
<body>
        
    <div class="grid">
    
    <button class="btn glow">Glow Effect</btn>
    <button class="btn left">Fill Left</btn>
    <button class="btn right">Fill Right</btn>
    <button class="btn center">Center Fill</btn>
    <button class="btn shine">Shine Sweep</btn>
    <button class="btn threeD">3D Press</btn>
    <button class="btn border">Border Glow</btn>
    <button class="btn ripple">Ripple Effect</btn>
    <button class="btn slide"><span>Text Slide</span></btn>
    </div>
</body>
</html>
